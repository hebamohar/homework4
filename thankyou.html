<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You - Superstar Clinic</title>
  <link href="style.css" rel="stylesheet" />
  <style>
    #footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background-color: #ffb6c1;
      text-align: center;
      padding: 25px;
      border-top: 3px solid black;
    }
    body { padding-bottom: 120px; }
  </style>
  <script>
    function getCookie(name) {
      let nameEQ = name + "=";
      let ca = document.cookie.split(";");
      for (let c of ca) {
        c = c.trim();
        if (c.indexOf(nameEQ) === 0)
          return decodeURIComponent(c.substring(nameEQ.length));
      }
      return null;
    }

    window.addEventListener("DOMContentLoaded", function () {
      let fname = getCookie("patientFirstName");
      let msg = document.getElementById("thankYouMsg");
      if (fname) {
        msg.textContent = "Thank you, " + fname + "! Your form has been successfully submitted.";
      }
    });
  </script>
</head>
<body>
  <div id="header">
    <div class="header-content">
      <h1>Superstar Clinic</h1>
    </div>
  </div>

  <div id="main">
    <h2>Submission Received</h2>
    <div class="form-container">
      <p id="thankYouMsg">Your form has been successfully submitted.</p>
      <p>Our team will review your information shortly.</p>
      <div class="button-row">
        <button onclick="window.location.href='homework4.html'">Return to Form</button>
      </div>
    </div>
  </div>

  <div id="footer">
    <p><strong>Superstar Clinic</strong></p>
    <p>PO Box 7392 · Houston, Texas 77009</p>
  </div>
</body>
</html>
